server.port=${PORT:8080}

# OpenAPI / API docs - only expose public API endpoints
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/api-docs

# Trust forwarded headers from App Engine's load balancer (fixes https:// URL generation)
server.forward-headers-strategy=framework

# Debug task endpoints (/tasks/debug/**) are disabled by default in production.
# Set to true (or env var DEBUG_TASKS_ENABLED=true) to enable.
debug.tasks.enabled=${DEBUG_TASKS_ENABLED:false}

# Actuator — expose only health, info, and metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true
management.info.build.enabled=true

# Health groups: liveness excludes external dependencies to avoid restart loops;
# readiness includes all indicators (Datastore, BigQuery). MTurk is excluded
# because Amazon shut the service down on 2026-09-30.
# Probes must be explicitly enabled outside Kubernetes (e.g. App Engine).
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,datastore,bigquery
# Mechanical Turk closed on this date. After it, /tasks/createHIT and
# /tasks/deleteHITs return without calling the MTurk API.
mturk.closure-date=2026-09-30
